<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt | MASOON TREUHAND</title>
  <meta name="description" content="Kontaktieren Sie MASOON TREUHAND in Luzern.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;500&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/global.css?v=20260915-2141">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-brand" href="../" aria-label="MASOON TREUHAND Startseite">
        <img class="site-brand__icon" src="../assets/images/logo/icon-white.png" alt="" aria-hidden="true">
        <img class="site-brand__text" src="../assets/images/logo/textlogo-white.png" alt="MASOON TREUHAND">
      </a>
      <nav class="site-nav" aria-label="Hauptnavigation">
        <a href="../">Startseite</a>
        <a href="../unternehmen/">Unternehmen</a>
        <a href="../dienstleistungen/">Dienstleistungen</a>
        <a href="../fachwissen/">Fachwissen</a>
        <a href="../kontakt/" aria-current="page">Kontakt</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="legal-section contact-section">
      <div class="container">
        <div class="legal-card contact-card">
          <div>
            <h1 class="page-title">Kontakt</h1>
          </div>

          <div class="legal-copy contact-form-wrap">
            <form class="contact-form" novalidate>
              <div class="contact-form__field">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name" required>
              </div>

              <div class="contact-form__field">
                <label for="email">E Mail</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
              </div>

              <div class="contact-form__field">
                <label for="telefon">Telefon</label>
                <input id="telefon" name="telefon" type="tel" autocomplete="tel">
              </div>

              <div class="contact-form__field">
                <label for="unternehmen">Unternehmen</label>
                <input id="unternehmen" name="unternehmen" type="text" autocomplete="organization">
              </div>

              <div class="contact-form__field contact-form__field--message">
                <label for="nachricht">Nachricht</label>
                <textarea id="nachricht" name="nachricht" rows="6" required></textarea>
              </div>

              <button class="action contact-form__submit" type="submit">Kontakt senden</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-links">
        <a class="footer-home" href="../">© 2026 MASOON TREUHAND</a>
        <a href="../disclaimer/">Disclaimer</a>
        <a href="../impressum/">Impressum</a>
        <a href="../datenschutz/">Datenschutz</a>
        <a href="../kontakt/" aria-current="page">Kontakt</a>
      </div>
    </div>
  </footer>

  <script src="../assets/site.js"></script>
</body>
</html>
