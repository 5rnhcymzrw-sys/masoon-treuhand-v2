<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff;font-family:"Inter",Arial,sans-serif}
    .site-header{height:108px;background:#000;color:#fff;display:flex;align-items:center}
    .header-inner{width:min(calc(100% - 64px),1227px);margin:0 auto;display:flex;align-items:center;justify-content:flex-end}
    .site-nav{align-items:center;gap:clamp(18px,2.2vw,34px);margin-left:auto;display:flex}
    .site-nav a{color:#fff;letter-spacing:.1em;text-transform:uppercase;padding:35px 0 32px;font-size:11px;font-weight:500;position:relative;text-decoration:none}
    .site-nav a:after{content:"";background:linear-gradient(90deg,#878787b8 0%,#d2d2d2eb 50%,#878787b8 100%);position:absolute;bottom:18px;left:0;right:100%;height:1px}
    .site-nav a:hover:after,.site-nav a.active:after{right:0}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <nav class="site-nav" aria-label="Hauptnavigation">
        <a class="active" href="#">Startseite</a>
        <a href="#">Unternehmen</a>
        <a href="#">Dienstleistungen</a>
        <a href="#">Fachwissen</a>
        <a href="#">Kontakt</a>
      </nav>
    </div>
  </header>
</body>
</html>
